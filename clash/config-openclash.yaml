# DNS防泄露版本
# 必读！！！
# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
# 跑裸核用户请自行去掉下方控制面板模块的注释。
# 机场订阅
# proxy-providers下的 interval: 604800  单位为秒  604800对应7天
proxy-providers:
  Airport1:
    url: "http://192.168.31.3:3001/T3B9dgzBzdRbBF8Acmli/download/collection/all?target=ClashMeta"
    type: http
    interval: 604800
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    proxy: 直连

# 节点信息
proxies:
  - {name: 直连, type: direct}
  # - {name: 直连, type: direct, udp: true}

# 全局配置 
mixed-port: 7890
# socks-port: 7891
# redir-port: 7892
# tproxy-port: 7894
# port: 7893
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
# interface-name: enxc8a3622b418d (根据情况指定出站接口，一般不需要)
# authentication  (代理用户验证信息)
#   - name: password
log-level: warning
# 匹配进程 always/strict/off
find-process-mode: always
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 为防止使用插件朋友遇到面板问题，我注释掉了此模块。
# external-controller: 0.0.0.0:9090
# secret: ""
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"
# external-ui-name: metacubexd
# external-ui-url: "https://github.com/MeteCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# external-ui-name: yacd-meta
# external-ui-url: "https://github.com/MeteCubeX/Yacd-meta/archive/refs/heads/gh-pages.zip"

# 嗅探（fakeip下其实可以不用嗅探）
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "+.apple.com"
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  #使用nikki，混入全部不修改的情况，开启接口指定为nikki
  #device: nikki
  #使用仅内核自行修改下面三项为true
#  auto-route: true
#  auto-redirect: true
#  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053
  ipv6: false
  # respect-rules: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter-mode: blacklist
  # default-nameserver:
  #   - https://223.5.5.5/dns-query
  # proxy-server-nameserver:
  #   - https://dns.alidns.com/dns-query
  #   - https://doh.pub/dns-query
  # direct-nameserver:
  #   - https://dns.alidns.com/dns-query
  #   - https://doh.pub/dns-query
  # nameserver:
  #   - https://8.8.8.8/dns-query#RULES&ecs=223.5.5.0/24
  nameserver:
    - 192.168.31.1
  fake-ip-filter:
    - "rule-set:fakeipfilter_domain"
 
# 出站策略，根据自己情况调整每个策略里分组排序，增删都可以，比如把美国自动放到第一个，比如删除香港故转，注意别漏掉表情逗号等。
# 如果相应分组没有筛选到对应的国家，请根据自己节点名字调整筛选关键字。
# 没有再使用锚点，是考虑很多新手修改难度，这样新手修改某个分组更容易些。
